[build]
  command = "node build.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Админку и служебные файлы не индексируем
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex"
